name: Social Report
on:
  schedule:
    # Every 30 min at :04 and :34, around the clock (Guy, Nov 2); the Mac launchd job is the main trigger. GitHub cron can run late.
    - cron: "4,34 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    environment:
      name: github-pages
      url: https://pocketlabgames.github.io/social-report/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Keys
        env:
          KEYS_TGZ: ${{ secrets.KEYS_TGZ }}
        run: mkdir -p "Private Keys" && echo "$KEYS_TGZ" | base64 -d | tar xz -C "Private Keys"
      - name: Report
        working-directory: Metrics
        env:
          REPORT_SITE: "1"
          TZ: America/New_York
        run: python social_report.py --no-open
      - name: Encrypt
        env:
          PW: ${{ secrets.REPORT_PASSWORD }}
        run: |
          npx -y staticrypt@3 "Metrics/Social Report.html" -p "$PW" --short -d site --salt d33749e38069f5b95adc7158ec6fc89f --config false --template-title "Beaker Lab - Social Report"
          mv "site/Social Report.html" site/index.html
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Metrics/social-stats-history.json Metrics/posts-history.json Metrics/installs-cache.json Metrics/countries-cache.json Metrics/ratings-cache.json Metrics/money-cache.json Metrics/gads-cache.json Metrics/metaads-cache.json Metrics/cache/report-last.json
          git commit -qm "Report $(TZ=America/New_York date '+%Y-%m-%d %H:%M')" || echo "nothing to save"
          git pull -q --rebase -X theirs || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages sometimes hangs, then refuses new deploys for up to ~50 min (Nov 5): wait and try again instead of failing right away
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
      - if: steps.deploy.outcome == 'failure'
        run: sleep 360
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 360
      - if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
